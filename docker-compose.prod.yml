name: bozar

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bozar_db}
      POSTGRES_USER: ${POSTGRES_USER:-bozar_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required}/bozar-backend:${VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-bozar_db}
      DB_USER: ${POSTGRES_USER:-bozar_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      RUN_MIGRATIONS: "true"
      IMAGE_STORAGE_PATH: /app/backend/uploads
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
    volumes:
      - uploads-data:/app/backend/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  web-app:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required}/bozar-web:${VERSION:-latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  admin-web:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required}/bozar-admin:${VERSION:-latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  gateway:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required}/bozar-gateway:${VERSION:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      web-app:
        condition: service_healthy
      admin-web:
        condition: service_healthy
    ports:
      - "${BOZAR_HTTP_PORT:-8200}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  uploads-data:
