name: Build and deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bozar-production
  cancel-in-progress: false

env:
  VERSION: ${{ github.sha }}
  REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: bozar-backend
            context: .
            file: backend/Dockerfile
          - image: bozar-web
            context: .
            file: web-app/Dockerfile
          - image: bozar-admin
            context: .
            file: admin-web/Dockerfile
          - image: bozar-gateway
            context: nginx
            file: nginx/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.REGISTRY_USER }}/${{ matrix.image }}:${{ env.VERSION }}
            ${{ env.REGISTRY_USER }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy production compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_SSH_PASSWORD }}
          source: docker-compose.prod.yml
          target: /home/${{ secrets.SERVER_USER }}/bozar
      - name: Pull and restart services
        uses: appleboy/ssh-action@v1
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          VERSION: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_SSH_PASSWORD }}
          envs: DOCKERHUB_USERNAME,VERSION
          script: |
            set -eu
            cd /home/${{ secrets.SERVER_USER }}/bozar
            test -f .env
            export DOCKERHUB_USERNAME VERSION
            docker compose -f docker-compose.prod.yml --env-file .env pull
            docker compose -f docker-compose.prod.yml --env-file .env up -d --remove-orphans
            docker compose -f docker-compose.prod.yml --env-file .env ps
            docker image prune -f
