name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm --dir backend build

      - name: Test backend
        run: pnpm --dir backend test

      - name: Build web app
        run: pnpm --dir web-app build

      - name: Build admin app
        run: pnpm --dir admin-web build

      - name: Typecheck mobile app
        run: pnpm --dir mobile-app exec tsc -b
